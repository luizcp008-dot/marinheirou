<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marinheirou Publicador</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 680px; margin: 48px auto; padding: 0 16px; line-height: 1.6; color: #1a1a1a; background: #fafafa; }
</style>
</head>
<body>
<h1>Finishing sign-in…</h1>
<p id="msg">Sending the authorization back to the Marinheirou Publicador tool on this computer.</p>
<script>
  // Login redirect landing: hands the OAuth code to the local tool (tt_upload.py) listening on this PC.
  var q = window.location.search;
  if (q) {
    window.location.replace("http://localhost:8765/callback" + q);
  } else {
    document.getElementById("msg").textContent = "Nothing to do here.";
  }
</script>
</body>
</html>
